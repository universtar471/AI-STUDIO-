[project]
name = "ai-interior-studio"
version = "0.1.0"
description = "AI Interior Studio - render from SketchUp and concept from plan"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",     # ComfyUI HTTP uploads, queue submission and image retrieval
  "pydantic>=2.6",    # schemas and validation for every shared contract
  "sqlalchemy>=2.0",  # SQLite persistence
  "fastapi>=0.115",  # REST validation and OpenAPI schemas
  "anyio>=4",       # structured WebSocket task cancellation
  "uvicorn>=0.30",   # Windows ASGI backend entry point
  "websockets>=13",  # WebSocket transport for uvicorn
  "python-multipart>=0.0.18",  # scene and reference image uploads
  "google-genai>=2.0",  # official Gemini SDK for the optional cloud provider
  "keyring>=25",  # API keys in Windows Credential Manager instead of files
  "pillow>=10.1",  # Style Pack checks: size, blur, perceptual hash
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",  # in-process API integration tests
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
